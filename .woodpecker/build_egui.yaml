matrix:
  include:
    - CHANNEL: stable
      FEATURES: disable_contracts,xdg-portal
    - CHANNEL: nightly
      FEATURES: xdg-portal

steps:
  build_egui:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    commands:
      - rustup default "$CHANNEL"
      - cargo build -p topola-egui --no-default-features --features "$FEATURES"
    when:
      event: [pull_request, push, tag]
      path:
        include:
          - '.woodpecker/*.yaml'
          - '*.toml'
          - 'crates/**'
          - 'src/**'
          - 'tests/**'
          - 'examples/**'
        exclude:
          - 'assets/**'
          - 'LICENSES/**'
          - 'locales/**'
          - '*.md'
        ignore_message: '[ALL]'
        on_empty: false
