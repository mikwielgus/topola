matrix:
  include:
    - CHANNEL: stable
      FEATURES: disable_contracts,xdg-portal
    - CHANNEL: nightly
      FEATURES: xdg-portal

steps:
  build_cli:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    commands:
      - rustup default "$CHANNEL"
      - cargo build -p topola-cli --no-default-features --features "$FEATURES" --
    when:
      event: [pull_request, push, tag]
      path:
        include:
          - '.woodpecker/*.yaml'
          - '*.toml'
          - 'crates/**'
          - 'src/**'
          - 'tests/**'
          - 'examples/**'
        exclude:
          - 'assets/**'
          - 'LICENSES/**'
          - 'locales/**'
          - '*.md'
        ignore_message: '[ALL]'
        on_empty: false

  # Testing is a step instead of a separate flow to reduce Codeberg's CI usage.
  test:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    commands:
      - rustup default "$CHANNEL"
      - cargo test --verbose --no-default-features --features "$FEATURES"
    when:
      event: [pull_request, push, tag]
      # Only run tests for stable channel to avoid straining Codeberg's CI.
      evaluate: 'CHANNEL == "stable"'
      path:
        include:
          - '.woodpecker/*.yaml'
          - '*.toml'
          - 'crates/**'
          - 'src/**'
          - 'tests/**'
          - 'examples/**'
        exclude:
          - 'assets/**'
          - 'LICENSES/**'
          - 'locales/**'
          - '*.md'
        ignore_message: '[ALL]'
        on_empty: false

  # Step instead of a separate flow to reduce Codeberg's CI usage.
  build_egui:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
    commands:
      - rustup default "$CHANNEL"
      - cargo build -p topola-egui --no-default-features --features "$FEATURES"
    when:
      event: [pull_request, push, tag]
      path:
        include:
          - '.woodpecker/*.yaml'
          - '*.toml'
          - 'crates/**'
          - 'src/**'
          - 'tests/**'
          - 'examples/**'
        exclude:
          - 'assets/**'
          - 'LICENSES/**'
          - 'locales/**'
          - '*.md'
        ignore_message: '[ALL]'
        on_empty: false

  # Step instead of a separate flow to reduce Codeberg's CI usage.
  build_wasm:
    image: rust
    environment:
      RUST_BACKTRACE: 1
      CARG_TERM_COLOR: always
    commands:
      - apt-get -y install curl
      - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - cargo binstall --no-confirm trunk
      - rustup default "$CHANNEL"
      - rustup target add wasm32-unknown-unknown
      - trunk build
    when:
      event: [pull_request, push, tag]
      path:
        include:
          - '.woodpecker/*.yaml'
          - '*.toml'
          - 'crates/**'
          - 'src/**'
          - 'tests/**'
          - 'examples/**'
        exclude:
          - 'assets/**'
          - 'LICENSES/**'
          - 'locales/**'
          - '*.md'
        ignore_message: '[ALL]'
        on_empty: false
