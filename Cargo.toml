[workspace]
members = [".", "crates/*", "crates/*/fuzz"]
resolver = "2"

[workspace.dependencies]
bimap = "0.6.3"
derive-getters = "0.5"
petgraph = { git = "https://codeberg.org/topola/petgraph.git" }
rstar = "0.12"
serde_json = "1.0"
spade = "2.12"
thiserror = "2.0"

[workspace.dependencies.geo-types]
version = "0.7"
default-features = false
features = ["serde"]

[workspace.dependencies.geo]
version = "0.29"
default-features = false
features = ["spade", "use-serde"]

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[package]
name = "topola"
description = "Work-in-progress free and open-source topological (rubberband) router and autorouter for printed circuit boards (PCBs)"
version = "0.1.0"
edition = "2021"

[features]
default = ["disable_contracts"]
disable_contracts = ["contracts-try/disable_contracts"]

[dependencies]
bimap.workspace = true
contracts-try = "0.7"
derive-getters.workspace = true
enum_dispatch = "0.3"
geo.workspace = true
petgraph.workspace = true
rstar.workspace = true
serde.workspace = true
spade.workspace = true
thiserror.workspace = true

[dependencies.specctra-core]
path = "crates/specctra-core"
features = ["rstar"]

[dev-dependencies]
serde_json.workspace = true

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
